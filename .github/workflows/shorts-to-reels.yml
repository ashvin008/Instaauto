name: YouTube Shorts to Instagram Reels

on:
  schedule:
    - cron: "*/15 * * * *" # every 15 minutes (GitHub may run it a few minutes late)
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run: show what would be posted, but don't post"
        type: boolean
        default: false

permissions:
  contents: write # to commit state.json back

concurrency:
  group: shorts-to-reels
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      YT_CHANNEL_ID: ${{ vars.YT_CHANNEL_ID }}
      CAPTION_TEMPLATE: ${{ vars.CAPTION_TEMPLATE }}
      DRY_RUN: ${{ inputs.dry_run }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Check YouTube for new Shorts
        id: check
        env:
          YT_API_KEY: ${{ secrets.YT_API_KEY }}
        run: python -m instaauto check

      # The heavier tools are only installed when there is actually something to post.
      - name: Install ffmpeg
        if: steps.check.outputs.pending == 'true'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg

      - name: Install Deno (needed by yt-dlp for YouTube)
        if: steps.check.outputs.pending == 'true'
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Install yt-dlp
        if: steps.check.outputs.pending == 'true'
        run: pip install -U "yt-dlp[default]"

      - name: Post Shorts as Reels
        if: steps.check.outputs.pending == 'true'
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          YT_COOKIES: ${{ secrets.YT_COOKIES }}
        run: python -m instaauto run

      - name: Save state
        if: always() && inputs.dry_run != true
        run: |
          [ -f state.json ] || exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state.json
          if git diff --cached --quiet; then
            echo "No state changes."
          else
            git commit -m "Update posted Shorts state"
            git push
          fi
