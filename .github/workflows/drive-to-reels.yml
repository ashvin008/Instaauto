name: Google Drive videos to Instagram Reels

on:
  schedule:
    - cron: "*/15 * * * *" # every 15 minutes (GitHub may run it a few minutes late)
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run: show what would be posted, but don't post"
        type: boolean
        default: false

permissions:
  contents: write # to commit state.json back

concurrency:
  group: drive-to-reels
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GDRIVE_FOLDER_ID: ${{ vars.GDRIVE_FOLDER_ID }}
      GDRIVE_SERVICE_ACCOUNT: ${{ secrets.GDRIVE_SERVICE_ACCOUNT }}
      CAPTION_TEMPLATE: ${{ vars.CAPTION_TEMPLATE }}
      MAX_POSTS_PER_RUN: ${{ vars.MAX_POSTS_PER_RUN }}
      DRY_RUN: ${{ inputs.dry_run }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Check Drive folder for new videos
        id: check
        run: python -m instaauto check

      # ffmpeg is only needed (to check/convert the video) when there is something to post.
      - name: Install ffmpeg
        if: steps.check.outputs.pending == 'true'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg

      - name: Post videos as Reels
        if: steps.check.outputs.pending == 'true'
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
        run: python -m instaauto run

      - name: Save state
        if: always() && inputs.dry_run != true
        run: |
          [ -f state.json ] || exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state.json
          if git diff --cached --quiet; then
            echo "No state changes."
          else
            git commit -m "Update posted videos state"
            git push
          fi
