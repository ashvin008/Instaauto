name: Refresh Instagram token

# Instagram long-lived tokens expire after 60 days. This refreshes it weekly and
# saves the new token back into the IG_ACCESS_TOKEN secret, so it never expires.
# Needs a GH_PAT secret: a fine-grained token for this repo with "Secrets: Read and write".

on:
  schedule:
    - cron: "0 3 * * 1" # Mondays 03:00 UTC
  workflow_dispatch:

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Refresh token and update secret
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::warning::GH_PAT secret is not set, so the token can't be refreshed automatically. Renew IG_ACCESS_TOKEN by hand before it expires (60 days)."
            exit 0
          fi
          resp=$(curl -fsS -G "https://graph.instagram.com/refresh_access_token" \
            --data-urlencode "grant_type=ig_refresh_token" \
            --data-urlencode "access_token=$IG_ACCESS_TOKEN")
          new_token=$(echo "$resp" | jq -r '.access_token // empty')
          if [ -z "$new_token" ]; then
            echo "::error::Instagram did not return a new token."
            exit 1
          fi
          echo "::add-mask::$new_token"
          gh secret set IG_ACCESS_TOKEN --body "$new_token" --repo "$GITHUB_REPOSITORY"
          echo "Token refreshed. Valid for $(( $(echo "$resp" | jq -r '.expires_in') / 86400 )) more days."
